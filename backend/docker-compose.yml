services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: bankapi-backend:prod
    container_name: bankapi_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 48300
      DB_HOST: db
      DB_PORT: 5432
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_COMMIT: ${APP_COMMIT:-unknown}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-48300}:48300"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - bankapi_net

  db:
    image: postgres:15-alpine
    container_name: bankapi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_DATABASE:-bankapi_db}
    ports:
      - "${DB_PORT:-48543}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-bankapi_db}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - bankapi_net

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:

networks:
  bankapi_net:
    driver: bridge
